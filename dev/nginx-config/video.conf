# Upstream: Your Node.js app
upstream node_app {
    server 127.0.0.1:4444;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;   # replace with your domain or IP

    # -------------------------------------------------
    # 1. Internal location – only reachable via X-Accel-Redirect
    # -------------------------------------------------
    location /internal-videos/ {
        internal;                                      # critical – blocks external access

        # Exact filesystem mapping:
        # X-Accel-Redirect: /internal-videos/<uuid>/video.mp4
        # becomes           /home/hridoy/Secret_Project/server/object-storage/videos/<uuid>/video.mp4
        alias /home/hridoy/Secret_Project/server/object-storage/videos/;

        # Performance (matches your 2 MB MAX_CHUNK_SIZE)
        sendfile           on;
        tcp_nopush         on;
        tcp_nodelay        on;
        output_buffers     1 2m;          # keep in sync with Node’s MAX_CHUNK_SIZE
        directio           off;           # sendfile is faster here

        # Headers that Node already set – reinforce them
        add_header Accept-Ranges  bytes always;
        add_header Cache-Control  "private, no-store" always;

        # Optional: hide the internal path from logs
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------
    # 2. Public video watch endpoint → Node.js (auth + range parsing)
    # -------------------------------------------------
    location /dekho/video/watch/ {
        proxy_pass         http://node_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Important for Range / 206 responses
        proxy_buffering        on;
        proxy_buffer_size      8k;
        proxy_buffers          8 8k;
        proxy_busy_buffers_size 16k;

        # Pass Range header to Node so your streamVideo logic works
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # -------------------------------------------------
    # 3. Everything else → Node.js (HTML, auth, upload, API…)
    # -------------------------------------------------
    location / {
        proxy_pass         http://node_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Useful for larger uploads if you ever need them
        client_max_body_size 500m;
    }
}