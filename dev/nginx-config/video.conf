# Upstream: Your Node.js app
upstream node_app {
    server 127.0.0.1:4444;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;   # replace with your domain or IP

    # -------------------------------------------------
    # 1. Internal video location – only via X-Accel-Redirect
    # -------------------------------------------------
    location /internal-videos/ {
        internal;
        alias /home/hridoy/Secret_Project/server/object-storage/videos/;
        sendfile           on;
        tcp_nopush         on;
        tcp_nodelay        on;
        output_buffers     1 2m;
        directio           off;
        add_header Accept-Ranges  bytes always;
        add_header Cache-Control  "private, no-store" always;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------
    # 2. Public thumbnails – served directly
    # -------------------------------------------------
    location /thumbnails/ {
        alias /home/hridoy/Secret_Project/server/object-storage/videos/;
        location ~* \.(jpg|jpeg|png|gif|webp)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
            access_log off;
            log_not_found off;
        }
        location ~* \.(mp4|webm|mkv|mov)$ {
            return 404;
        }
    }

    # -------------------------------------------------
    # 3. Video watch endpoint – passes to Node (range handling)
    # -------------------------------------------------
    location /watch/ {
        proxy_pass         http://node_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering        on;
        proxy_buffer_size      8k;
        proxy_buffers          8 8k;
        proxy_busy_buffers_size 16k;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # -------------------------------------------------
    # 4. Everything else → Node.js
    # -------------------------------------------------
    location / {
        proxy_pass         http://node_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
    }
}